    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #080b12;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .titulo {
        font-size: 22px;
        letter-spacing: 3px;
        font-weight: bold;
    }

    /* Bolinha minúscula */
    #botaoAcesso {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5da9ff;
        cursor: pointer;
        opacity: 0.7;
        transition: 0.2s;
    }

    #botaoAcesso:hover {
        opacity: 1;
        transform: scale(1.3);
    }

    /* Caixa de login */
    #login {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        padding: 24px;
        background: #10151f;
        border: 1px solid #263247;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #login h2 {
        font-size: 18px;
        margin-bottom: 16px;
    }

    #senha {
        width: 100%;
        padding: 11px;
        background: #080b12;
        color: white;
        border: 1px solid #303c52;
        border-radius: 7px;
        outline: none;
        margin-bottom: 10px;
    }

    #entrar {
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 7px;
        background: #3d8bfd;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    #mensagem {
        margin-top: 10px;
        font-size: 12px;
        text-align: center;
        color: #ff6b6b;
    }

    /* Painel */
    #painel {
        display: none;
        width: min(900px, 92%);
    }

    #painel h1 {
        margin-bottom: 8px;
    }

    #painel p {
        color: #8f9bad;
        margin-bottom: 20px;
    }

    .card {
        background: #10151f;
        border: 1px solid #263247;
        border-radius: 10px;
        padding: 18px;
    }

    textarea {
        width: 100%;
        height: 300px;
        resize: vertical;
        background: #080b12;
        color: #dbe7ff;
        border: 1px solid #303c52;
        border-radius: 8px;
        padding: 14px;
        font-family: monospace;
        font-size: 14px;
        outline: none;
    }

    #salvar {
        margin-top: 12px;
        padding: 10px 18px;
        border: 0;
        border-radius: 7px;
        background: #3d8bfd;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
</style>





<div class="titulo" id="bloqueado">
    ACESSO RESTRITO
</div>

<div id="botaoAcesso" title="Acesso"></div>

<div id="login">
    <h2>Acesso restrito</h2>

    <input
        id="senha"
        type="password"
        placeholder="Digite a senha"
        autocomplete="off"
    >

    <button id="entrar">ENTRAR</button>

    <div id="mensagem"></div>
</div>

<main id="painel">
    <h1>Biblioteca Lua</h1>
    <p>Seu espaço privado para armazenar scripts Lua.</p>

    <div class="card">
        <textarea id="codigo" placeholder="Cole seu código Lua aqui..."></textarea>
        <button id="salvar">SALVAR</button>
    </div>
</main>

<script>
    /*
     * PROTEÇÃO SIMPLES
     *
     * Esta é apenas uma versão inicial.
     * Para segurança real, a senha deve ser validada
     * pelo Cloudflare Worker e não pelo navegador.
     */

    const senhaCorreta = "guizinho0dx_0///code";

    const botaoAcesso = document.getElementById("botaoAcesso");
    const login = document.getElementById("login");
    const senha = document.getElementById("senha");
    const entrar = document.getElementById("entrar");
    const mensagem = document.getElementById("mensagem");
    const bloqueado = document.getElementById("bloqueado");
    const painel = document.getElementById("painel");

    botaoAcesso.addEventListener("click", () => {
        login.style.display = "block";
        senha.focus();
    });

    entrar.addEventListener("click", verificarSenha);

    senha.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            verificarSenha();
        }
    });

    function verificarSenha() {
        if (senha.value === senhaCorreta) {
            login.style.display = "none";
            bloqueado.style.display = "none";
            botaoAcesso.style.display = "none";
            painel.style.display = "block";
        } else {
            mensagem.textContent = "Senha incorreta.";
            senha.value = "";
            senha.focus();
        }
    }

    document.getElementById("salvar").addEventListener("click", () => {
        localStorage.setItem(
            "meu_script_lua",
            document.getElementById("codigo").value
        );

        alert("Código salvo neste navegador.");
    });

    const codigoSalvo = localStorage.getItem("meu_script_lua");

    if (codigoSalvo) {
        document.getElementById("codigo").value = codigoSalvo;
    }
</script>
