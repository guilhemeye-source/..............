<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pyllo Code</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:bold;letter-spacing:1px}
main{max-width:900px;margin:30px auto;padding:0 16px}
h2{font-size:18px;margin:0 0 15px}
.panel{background:#111;border:1px solid #292929;padding:18px;border-radius:10px;margin-bottom:20px}
input,textarea{width:100%;background:#080808;color:white;border:1px solid #333;border-radius:6px;padding:12px;margin:7px 0 14px;font:14px Arial;outline:none}
input:focus,textarea:focus{border-color:#aaa}
textarea{min-height:250px;resize:vertical;font-family:monospace;line-height:1.5}
button{background:#f5f5f5;color:#080808;border:0;padding:11px 16px;border-radius:6px;font-weight:bold;cursor:pointer}
button.secondary{background:#222;color:#fff;border:1px solid #444}
button.danger{background:#292929;color:#fff;border:1px solid #555}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.item{border:1px solid #292929;padding:14px;border-radius:7px;margin-top:10px;background:#0b0b0b}
.item-name{font-weight:bold;overflow-wrap:anywhere}
.item small{display:block;color:#999;margin:6px 0 12px}
#status{font-size:13px;color:#bbb;margin-top:12px;min-height:18px}
#preview{display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#050505;border:1px solid #333;padding:14px;border-radius:6px;max-height:400px;overflow:auto;font:13px monospace}
.empty{color:#888;font-size:14px;padding:12px 0}
footer{text-align:center;color:#666;font-size:12px;padding:25px}
</style>
</head>
<body>

<header>
  <div class="logo">PYLLO CODE</div>
  <div style="font-size:12px;color:#888">PUBLIC CODE</div>
</header>

<main>
  <section class="panel">
    <h2>Publicar código</h2>

    <label for="filename">Nome do código</label>
    <input id="filename" placeholder="Exemplo: meu-script.lua" maxlength="80">

    <label for="code">Código</label>
    <textarea id="code" spellcheck="false" placeholder="Escreva ou cole seu código aqui..."></textarea>

    <div class="actions">
      <button id="publish">PUBLICAR</button>
      <button class="secondary" id="clear">LIMPAR</button>
    </div>

    <div id="status"></div>
  </section>

  <section class="panel">
    <h2>Códigos publicados</h2>
    <div id="files"><div class="empty">Carregando códigos...</div></div>
  </section>

  <section class="panel" id="viewer" style="display:none">
    <h2 id="viewTitle">Visualizar código</h2>
    <pre id="preview"></pre>
    <div class="actions" style="margin-top:12px">
      <button class="secondary" id="copyRaw">COPIAR RAW</button>
      <button class="secondary" id="download">BAIXAR</button>
      <button class="danger" id="delete">EXCLUIR</button>
      <button class="secondary" id="close">FECHAR</button>
    </div>
    <div id="rawText" style="font-size:12px;color:#aaa;overflow-wrap:anywhere;margin-top:12px"></div>
  </section>
</main>

<footer>PYLLO CODE — SIMPLE CODE STORAGE</footer>

<script>
const API_URL = "https://aphiw-code.guilhemeye.workers.dev";

const $ = id => document.getElementById(id);
let selectedFile = null;
let selectedRaw = "";
let selectedCode = "";

function status(message){
  $("status").textContent = message;
}

function safeName(name){
  return name.trim().replace(/[^a-zA-Z0-9._-]/g,"-");
}

async function loadFiles(){
  $("files").innerHTML = '<div class="empty">Carregando...</div>';

  try{
    const response = await fetch(API_URL + "/api/files");
    if(!response.ok) throw new Error("Não foi possível carregar a lista.");

    const files = await response.json();
    $("files").innerHTML = "";

    if(!files.length){
      $("files").innerHTML = '<div class="empty">Nenhum código publicado ainda.</div>';
      return;
    }

    files.forEach(file => {
      const item = document.createElement("div");
      item.className = "item";

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = file.name;

      const info = document.createElement("small");
      info.textContent = "Arquivo publicado no GitHub";

      const open = document.createElement("button");
      open.textContent = "VISUALIZAR";
      open.className = "secondary";
      open.onclick = () => viewFile(file.name, file.rawUrl);

      item.append(name, info, open);
      $("files").appendChild(item);
    });
  }catch(error){
    $("files").innerHTML =
      '<div class="empty">Erro ao carregar. Confira se o Worker foi configurado.</div>';
  }
}

async function viewFile(name, rawUrl){
  try{
    const response = await fetch(rawUrl);
    if(!response.ok) throw new Error("Falha ao abrir o código.");

    selectedCode = await response.text();
    selectedFile = name;
    selectedRaw = rawUrl;

    $("viewTitle").textContent = name;
    $("preview").textContent = selectedCode;
    $("preview").style.display = "block";
    $("viewer").style.display = "block";
    $("rawText").textContent = rawUrl;

    $("viewer").scrollIntoView({behavior:"smooth"});
  }catch(error){
    alert("Não foi possível abrir esse código.");
  }
}

$("publish").onclick = async () => {
  const filename = safeName($("filename").value);
  const code = $("code").value;

  if(!filename || !code.trim()){
    status("Preencha o nome e o código.");
    return;
  }

  if(!/\.[a-zA-Z0-9]+$/.test(filename)){
    status("Coloque a extensão do arquivo, por exemplo .lua");
    return;
  }

  $("publish").disabled = true;
  status("Publicando no GitHub...");

  try{
    const response = await fetch(API_URL + "/api/publish",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({filename,code})
    });

    const result = await response.json();

    if(!response.ok) throw new Error(result.error || "Erro ao publicar.");

    status("Publicado com sucesso! RAW: " + result.rawUrl);
    $("filename").value = "";
    $("code").value = "";
    await loadFiles();
    await viewFile(result.filename, result.rawUrl);
  }catch(error){
    status(error.message || "Não foi possível publicar.");
  }finally{
    $("publish").disabled = false;
  }
};

$("clear").onclick = () => {
  $("filename").value = "";
  $("code").value = "";
  status("");
};

$("copyRaw").onclick = async () => {
  if(!selectedRaw) return;
  await navigator.clipboard.writeText(selectedRaw);
  status("Link RAW copiado!");
};

$("download").onclick = () => {
  if(!selectedFile) return;
  const blob = new Blob([selectedCode],{type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = selectedFile;
  a.click();
  URL.revokeObjectURL(url);
};

$("delete").onclick = async () => {
  if(!selectedFile) return;
  const key = prompt("Digite a chave de administrador para excluir:");
  if(!key) return;

  if(!confirm("Deseja realmente excluir " + selectedFile + "?")) return;

  try{
    const response = await fetch(API_URL + "/api/delete",{
      method:"DELETE",
      headers:{
        "Content-Type":"application/json",
        "x-admin-key":key
      },
      body:JSON.stringify({filename:selectedFile})
    });

    const result = await response.json();
    if(!response.ok) throw new Error(result.error || "Não foi possível excluir.");

    $("viewer").style.display = "none";
    status("Código excluído.");
    await loadFiles();
  }catch(error){
    alert(error.message);
  }
};

$("close").onclick = () => {
  $("viewer").style.display = "none";
};

loadFiles();
</script>
</body>
</html>
