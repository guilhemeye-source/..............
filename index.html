<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pyllo Code</title><style>
:root{color-scheme:dark;--bg:#080808;--card:#111;--line:#333;--muted:#aaa;--white:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:16px/1.5 Arial,sans-serif}.wrap{max-width:800px;margin:auto;padding:24px 16px}h1{font-size:2.2rem;margin:.2rem 0 .5rem}h2{font-size:1.2rem;margin:28px 0 10px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;background:#080808;color:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}textarea{min-height:240px;font-family:ui-monospace,monospace;resize:vertical}button{border:0;border-radius:999px;background:#f5f5f5;color:#080808;padding:10px 16px;font-weight:bold;cursor:pointer;margin:10px 6px 0 0}.secondary{background:transparent;color:#fff;border:1px solid var(--line)}.danger{background:#271b1b;color:#fff;border:1px solid #633}.file{border-bottom:1px solid var(--line);padding:14px 0}.file:last-child{border:0}pre{white-space:pre-wrap;overflow:auto;background:#070707;border:1px solid var(--line);border-radius:8px;padding:14px;font:14px/1.5 ui-monospace,monospace}.link{word-break:break-all;background:#202020;padding:12px;border-radius:8px;margin-top:12px}.error{color:#ff9191}.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.small{font-size:.9rem}</style></head><body><main class="wrap" id="app"></main><script>
(function(){const API='https://pyllo-code-worker.pyllonillo-code.workers.dev',app=document.getElementById('app');let files=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>location.hash.match(/^#\/s\/([a-f0-9]{18})$/)?.[1];
function home(msg=''){app.innerHTML=`<h1>Pyllo Code</h1><p class="muted">Salve seu código no site e gere um link para compartilhar, sem publicar o conteúdo no GitHub.</p><section class="card"><label>Nome do espaço</label><input id="name" placeholder="meu projeto" maxlength="80"><label>Nome do arquivo</label><input id="fn" placeholder="script.lua"><label>Código</label><textarea id="code" placeholder="Cole seu código aqui"></textarea><div class="row"><button onclick="saveNew()">Salvar e gerar link</button></div><p class="error">${esc(msg)}</p></section>`}
async function saveNew(){const name=document.getElementById('name').value.trim()||'Meu código',fn=document.getElementById('fn').value.trim()||'codigo.txt',code=document.getElementById('code').value;if(!code.trim())return home('Cole algum código antes de salvar.');files=[{name:fn,content:code}];try{const r=await fetch(API+'/api/sites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,files})});const d=await r.json();if(!r.ok)throw Error(d.error);location.hash='#/s/'+d.id}catch(e){home(e.message)}}
async function site(key){app.innerHTML='<h1>Carregando...</h1>';try{const r=await fetch(API+'/api/sites/'+key),d=await r.json();if(!r.ok)throw Error(d.error);const share=location.href;app.innerHTML=`<p><a href="#">← Criar outro</a></p><h1>${esc(d.name)}</h1><p class="muted">Código salvo no Pyllo Code.</p><div class="link"><strong>Link para compartilhar:</strong><br>${esc(share)}<br><button onclick="navigator.clipboard.writeText(location.href);this.textContent='Link copiado!'">Copiar link</button></div><h2>Arquivos</h2><section class="card">${d.files.map(f=>`<article class="file"><strong>${esc(f.name)}</strong><pre>${esc(f.content)}</pre><button class="secondary" onclick="downloadFile(${JSON.stringify(f.name)},${JSON.stringify(f.content)})">Baixar</button></article>`).join('')}</section>`}catch(e){app.innerHTML=`<h1>Link não encontrado</h1><p class="error">${esc(e.message)}</p><a href="#">Voltar</a>`}}
window.downloadFile=(name,content)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.download=name;a.click()};window.saveNew=saveNew;window.addEventListener('hashchange',()=>id()?site(id()):home());id()?site(id()):home()})();</script></body></html>
